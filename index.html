<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1224">
  <meta name="robots" content="index,follow">
  <title>臺北市幼兒園聯絡資料查詢</title>

  <style>
    :root{
      --bg:#07101f;
      --bg2:#0d1730;
      --line:rgba(255,255,255,.12);
      --shadow:0 24px 80px rgba(0,0,0,.38);
      --radius:24px;
      --frame-max:1600px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:var(--bg)}
    body{
      overflow-x:hidden;
      font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-15%;
      pointer-events:none;
      z-index:0;
      background:
        radial-gradient(circle at 12% 20%,rgba(71,121,255,.30),transparent 22%),
        radial-gradient(circle at 86% 18%,rgba(143,87,255,.24),transparent 20%),
        radial-gradient(circle at 48% 92%,rgba(0,205,255,.14),transparent 24%);
      filter:blur(10px);
      animation:aurora 14s ease-in-out infinite alternate;
    }

    .stars{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:.45;
      background-image:
        radial-gradient(circle at 10% 20%,#fff 0 1px,transparent 1.7px),
        radial-gradient(circle at 32% 72%,#fff 0 .8px,transparent 1.5px),
        radial-gradient(circle at 58% 30%,#fff 0 1px,transparent 1.7px),
        radial-gradient(circle at 82% 64%,#fff 0 .8px,transparent 1.5px);
      background-size:250px 250px,310px 310px,290px 290px,340px 340px;
      animation:starMove 55s linear infinite;
    }

    .page{
      position:relative;
      z-index:1;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }

    .shell{
      width:min(var(--frame-max), 100%);
      height:calc(100vh - 20px);
      min-height:560px;
      position:relative;
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      background:rgba(7,13,28,.58);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      transform:translateZ(0);
    }

    .shell::before{
      content:"";
      position:absolute;
      z-index:3;
      left:-30%;
      top:0;
      width:32%;
      height:2px;
      background:linear-gradient(90deg,transparent,#fff,transparent);
      filter:drop-shadow(0 0 10px rgba(255,255,255,.8));
      animation:scan 9s ease-in-out infinite;
      pointer-events:none;
    }

    .loader{
      position:absolute;
      inset:0;
      z-index:5;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 40%,rgba(72,116,255,.18),transparent 22%),
        linear-gradient(180deg,#071021,#0a1122);
      transition:opacity .35s ease, visibility .35s ease;
    }

    .loader.done{opacity:0;visibility:hidden;pointer-events:none}

    .loader-core{
      width:96px;
      height:96px;
      position:relative;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.18);
      box-shadow:
        0 0 45px rgba(74,113,255,.25),
        inset 0 0 30px rgba(119,89,255,.16);
      animation:coreFloat 2.4s ease-in-out infinite;
    }

    .loader-core::before,
    .loader-core::after{
      content:"";
      position:absolute;
      inset:17px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.15);
    }
    .loader-core::after{
      inset:-12px;
      border-style:dashed;
      animation:spin 5s linear infinite;
    }

    .loader-dot{
      position:absolute;
      width:12px;
      height:12px;
      left:42px;
      top:42px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 24px rgba(255,255,255,.95),0 0 60px rgba(85,129,255,.75);
    }

    .loader-text{
      position:absolute;
      top:calc(50% + 72px);
      left:0;
      right:0;
      text-align:center;
      color:rgba(255,255,255,.82);
      font-size:15px;
      letter-spacing:.16em;
    }

    iframe{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#fff;
      opacity:0;
      transform:scale(.985);
      transition:opacity .45s ease, transform .45s ease;
    }

    iframe.ready{
      opacity:1;
      transform:scale(1);
    }

    @keyframes aurora{
      from{transform:translate3d(-1%,0,0) scale(1)}
      to{transform:translate3d(1.5%,-1%,0) scale(1.04)}
    }
    @keyframes starMove{
      to{transform:translate3d(-45px,-60px,0)}
    }
    @keyframes scan{
      0%{left:-32%;opacity:0}
      12%{opacity:1}
      32%,100%{left:132%;opacity:0}
    }
    @keyframes coreFloat{
      0%,100%{transform:translateY(0) rotateX(0deg) rotateY(0deg)}
      50%{transform:translateY(-7px) rotateX(8deg) rotateY(-12deg)}
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    @media (max-width:900px){
      .page{padding:0}
      .shell{
        width:100%;
        height:100dvh;
        min-height:100dvh;
        border-radius:0;
        border-left:0;
        border-right:0;
      }
    }

    @media (max-width:560px){
      .shell{border-radius:0}
      .loader-core{width:82px;height:82px}
      .loader-dot{left:35px;top:35px}
      .loader-text{top:calc(50% + 62px);font-size:13px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
    }
  </style>
</head>

<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="page">
    <section class="shell" aria-label="臺北市幼兒園聯絡資料查詢">
      <div id="loader" class="loader" aria-live="polite">
        <div class="loader-core" aria-hidden="true">
          <div class="loader-dot"></div>
        </div>
        <div class="loader-text">LOADING</div>
      </div>
      
      <iframe
        id="gasFrame"
        title="臺北市幼兒園聯絡資料查詢"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </section>
  </main>

  <script>
    (function(){
      "use strict";
      var p1 = "https://script.";
      var p2 = "google.com/macros/s/";
      var p3 = "AKfycbyXNfhSoxgN7wyg3VkcemoHmYxn6l1YSdg7qDffJ2o9-Nc1CoYMzDKw9IdA6s3FN0Zf";
      var p4 = "/exec";
      var target = p1 + p2 + p3 + p4;

      var frame = document.getElementById("gasFrame");
      var loader = document.getElementById("loader");

      frame.src = target;

      frame.addEventListener("load", function(){
        requestAnimationFrame(function(){
          frame.classList.add("ready");
          setTimeout(function(){
            loader.classList.add("done");
          }, 120);
        });
      });

      /* 阻擋 GitHub 外層頁面的右鍵與部分常見檢視快捷鍵。 */
      document.addEventListener("contextmenu", function(e){
        e.preventDefault();
      }, {passive:false});

      document.addEventListener("dragstart", function(e){
        e.preventDefault();
      }, {passive:false});

      document.addEventListener("selectstart", function(e){
        e.preventDefault();
      }, {passive:false});

      document.addEventListener("keydown", function(e){
        var k = String(e.key || "").toLowerCase();
        var blocked =
          k === "f12" ||
          (e.ctrlKey && e.shiftKey && ["i","j","c"].indexOf(k) !== -1) ||
          (e.ctrlKey && ["u","s"].indexOf(k) !== -1) ||
          (e.metaKey && e.altKey && ["i","j","u"].indexOf(k) !== -1);

        if(blocked){
          e.preventDefault();
          e.stopPropagation();
        }
      }, {capture:true});

      /* 滑鼠在外框上形成細微 3D 浮動 */
      var shell = document.querySelector(".shell");
      var canTilt = window.matchMedia("(pointer:fine)").matches;

      if(canTilt){
        shell.addEventListener("pointermove", function(e){
          var r = shell.getBoundingClientRect();
          var x = (e.clientX - r.left) / r.width - .5;
          var y = (e.clientY - r.top) / r.height - .5;
          shell.style.transform =
            "perspective(1800px) rotateX(" + (-y * 1.25) + "deg) rotateY(" + (x * 1.25) + "deg) translateZ(0)";
        });

        shell.addEventListener("pointerleave", function(){
          shell.style.transform =
            "perspective(1800px) rotateX(0deg) rotateY(0deg) translateZ(0)";
        });
      }
    })();
  </script>
</body>
</html>
