<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1224">
  <meta name="robots" content="index,follow">
  <title>臺北市幼兒園聯絡資料查詢</title>

  <style>
    :root{
      --bg:#07101f;
    }

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      background:var(--bg);
      overflow:hidden;
    }

    *{
      box-sizing:border-box;
    }

    body{
      font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
    }

    /*
     * 外層只負責承載 GAS iframe。
     * 不再建立額外 page / shell 高度、margin、padding，
     * 避免瀏覽器產生第二條垂直或水平捲軸。
     */
    #gasFrame{
      position:fixed;
      inset:0;
      display:block;
      width:100%;
      height:100%;
      min-width:100%;
      min-height:100%;
      margin:0;
      padding:0;
      border:0;
      outline:0;
      background:#fff;
      overflow:hidden;
      opacity:1;
      transform:none;
    }

    /*
     * 只保留非常輕量的背景；iframe 覆蓋整個視窗後不會干擾使用。
     * 不再有 Loader、LOADING、淡入、縮放或框架動畫。
     */
    .bg{
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      overflow:hidden;
      background:
        radial-gradient(circle at 12% 20%,rgba(71,121,255,.18),transparent 22%),
        radial-gradient(circle at 86% 18%,rgba(143,87,255,.14),transparent 20%),
        radial-gradient(circle at 48% 92%,rgba(0,205,255,.10),transparent 24%),
        var(--bg);
    }

    @media (max-width:900px){
      html,
      body{
        width:100%;
        height:100%;
        min-height:100%;
        overflow:hidden;
      }

      #gasFrame{
        position:fixed;
        inset:0;
        width:100%;
        height:100dvh;
        min-width:100%;
        min-height:100dvh;
      }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <iframe
    id="gasFrame"
    title="臺北市幼兒園聯絡資料查詢"
    src="https://script.google.com/macros/s/AKfycbyXNfhSoxgN7wyg3VkcemoHmYxn6l1YSdg7qDffJ2o9-Nc1CoYMzDKw9IdA6s3FN0Zf/exec"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="clipboard-read; clipboard-write">
  </iframe>

  <script>
    (function(){
      "use strict";

      /* 阻擋外層頁面的右鍵與部分常見檢視快捷鍵。 */
      document.addEventListener("contextmenu", function(e){
        e.preventDefault();
      }, {passive:false});

      document.addEventListener("dragstart", function(e){
        e.preventDefault();
      }, {passive:false});

      document.addEventListener("selectstart", function(e){
        e.preventDefault();
      }, {passive:false});

      document.addEventListener("keydown", function(e){
        var k = String(e.key || "").toLowerCase();

        var blocked =
          k === "f12" ||
          (e.ctrlKey && e.shiftKey && ["i","j","c"].indexOf(k) !== -1) ||
          (e.ctrlKey && ["u","s"].indexOf(k) !== -1) ||
          (e.metaKey && e.altKey && ["i","j","u"].indexOf(k) !== -1);

        if(blocked){
          e.preventDefault();
          e.stopPropagation();
        }
      }, {capture:true});
    })();
  </script>
</body>
</html>
